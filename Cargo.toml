[package]
name = "lib-fltk-omarchy"
version = "0.0.10"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Omarchy toolkit for fltk-rs: live Omarchy theme, the classic Omarchy components, window modes and app helpers"
authors = ["Andrés Villagrán"]
keywords = ["fltk", "gui", "omarchy", "hyprland", "toolkit"]
categories = ["gui"]
publish = false
repository = "https://github.com/avillagran/lib-fltk-omarchy"
readme = "README.md"

[lib]
name = "fltk_omarchy"

[dependencies]
fltk = { version = "=1.5.23", features = ["no-images"] }
serde_json = "1"
# Markdown for `text` (MIT). No default features: no HTML writer, no CLI.
pulldown-cmark = { version = "0.13.5", default-features = false }
# Grapheme clusters for line breaking and selection (MIT OR Apache-2.0).
# 1.12: 1.13 needs Rust 1.85 (the crate builds on 1.80; CI checks it).
unicode-segmentation = "=1.12.0"
# Unicode Bidirectional Algorithm for right-to-left lines in `text`
# (MIT OR Apache-2.0, no dependencies).
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["std", "hardcoded-data"] }
# Only with the `gpu` feature (MIT OR Apache-2.0 OR Zlib).
glow = { version = "0.16", optional = true }
# Only with the `qr` feature (MIT OR Apache-2.0, no dependencies without
# its default features; Rust 1.67).
qrcode = { version = "0.14.1", optional = true, default-features = false }
# Only with the `a11y` feature (all MIT OR Apache-2.0). This feature needs
# Rust 1.85 (the rest of the crate keeps 1.80): accesskit_unix 0.19, the
# last release on 1.80, waits for AT-SPI's `ScreenReaderEnabled`, which
# at-spi2-core 2.62 no longer has, so apps never became accessible on
# current Linux. accesskit_unix 0.22+ follows `IsEnabled` and needs 1.85.
# These are the newest releases whose rust-version is 1.85.
accesskit = { version = "=0.25.0", optional = true }
# Already used by every platform adapter (no extra code); the a11y tests
# validate their trees with it (`a11y::testing`).
accesskit_consumer = { version = "=0.39.0", optional = true }
# Only with the `images` feature (all MIT OR Apache-2.0, pure Rust, no
# `image` umbrella crate). This feature needs Rust 1.80.1 (image-webp
# 0.2.4); the rest of the crate keeps 1.80. See docs/MEDIA.md.
png = { version = "=0.18.1", optional = true }
gif = { version = "=0.14.2", optional = true, default-features = false, features = ["std"] }
zune-jpeg = { version = "=0.5.15", optional = true }
image-webp = { version = "=0.2.4", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
accesskit_unix = { version = "=0.23.0", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { version = "=0.35.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "=0.27.0", optional = true }

# Linux: FLTK's hybrid Wayland + X11 backend (one fltk-sys build; features
# of the same dependency are merged per target). macOS and Windows use
# FLTK's Cocoa and WinAPI backends. See docs/PLATFORMS.md.
[target.'cfg(target_os = "linux")'.dependencies]
fltk = { version = "=1.5.23", features = ["use-wayland", "no-images"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# GPU shaders (gfx::gpu::GpuView). Off by default: it turns on fltk's
# enable-glwindow, which changes the fltk-sys build of the whole app.
gpu = ["fltk/enable-glwindow", "dep:glow"]
# Screen-reader support through AccessKit (AT-SPI on Linux/BSD, UI
# Automation on Windows, NSAccessibility on macOS). See docs/ACCESSIBILITY.md.
# QR codes (`qr::Qr`), for pairing and invite links. Off by default.
qr = ["dep:qrcode"]
a11y = ["dep:accesskit", "dep:accesskit_consumer", "dep:accesskit_unix", "dep:accesskit_windows", "dep:accesskit_macos"]
# Image decoding and display (`media`: PNG, JPEG, GIF, WebP). Off by
# default; fltk keeps `no-images` either way. See docs/MEDIA.md.
images = ["dep:png", "dep:gif", "dep:zune-jpeg", "dep:image-webp"]
# Native Mermaid diagrams (`mermaid`: flowchart, sequence, state) drawn
# with the CPU `gfx` canvas; no new dependencies. Off by default. See
# docs/MERMAID.md.
mermaid = []
# Video and audio playback (`media::Video`, `media::Audio`) through the
# system ffmpeg/ffprobe binaries as child processes: no native libraries.
# Off by default; builds on `images`. See docs/MEDIA.md.
playback = ["images"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 1

[[test]]
name = "ui"
harness = false

[profile.dev]
incremental = false
debug = "line-tables-only"

[[example]]
name = "gpu_bench"
required-features = ["gpu"]

[[example]]
name = "a11y_check"
required-features = ["a11y"]

[[example]]
name = "mermaid"
required-features = ["mermaid"]

[[example]]
name = "media"
required-features = ["images"]

[[example]]
name = "media_bench"
required-features = ["images"]

[[example]]
name = "playback"
required-features = ["playback"]

[[example]]
name = "playback_bench"
required-features = ["playback"]

[[example]]
name = "scene_gpu_check"
required-features = ["gpu"]
